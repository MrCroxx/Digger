name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build, tests and DMG
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # The runner's default Xcode 16 cannot build this Swift 6.2 package.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check source and toolchain
        run: |
          git diff --check HEAD^ HEAD
          xcodebuild -version
          swift --version

      - name: Build debug executable
        run: swift build --configuration debug

      - name: Test and package release app, DMG and ZIP
        env:
          BUILD_CONFIGURATION: release
          DIGGER_MAC_UNSIGNED: '1'
        run: ./scripts/package-desktop.sh

      - name: Upload macOS installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Digger-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
